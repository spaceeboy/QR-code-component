<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap" rel="stylesheet">

        <title>Qr Code Component</title>
        <script src="https://cdn.tailwindcss.com"></script>

        <script>
          tailwind.config = {
            theme: {
             extend:{
              colors: {
              'slate-300': 'hsl(212, 45%, 89%)',
              'slate-500': 'hsl(216, 15%, 48%)',
              'slate-900': 'hsl(218, 44%, 22%)'
              },

              fontFamily: {
                outfit : ['Outfit', 'sans-serif']

              }
            }
           }
          }
        </script>

    </head>

    <body class="font-outfit bg-slate-300 ">

        <main class="min-h-screen flex justify-center items-center">
            <article class="bg-white p-4 max-w-xs flex flex-col items-center rounded-xl shadow-lg">
                <img src="/image-qr-code.png" alt="Qr Code" class="w-full rounded-lg">

                <h1 class="font-semibold py-2 text-xl">Improve your front-end <br>skills by building projects</h1>
                <p class="text-[15px] text-slate-500">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>

            </article>
        </main>

    </body>
</html>
